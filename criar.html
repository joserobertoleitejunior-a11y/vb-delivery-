<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Criar meu delivery · VB Delivery</title>
<meta name="description" content="Monte seu cardápio digital com pedido direto no WhatsApp.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/img/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css?v=4">
<link rel="stylesheet" href="/assets/css/marca.css?v=2">
<link rel="stylesheet" href="/assets/css/painel.css?v=4">
<style>
  body { padding-bottom: 0; }
  /* topo do assistente: mesmo do "Criar seu site" do Agenda */
  .cw-topo { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.2rem; background: var(--branco); border-bottom: 1px solid var(--borda); }
  .cw-topo .brand { font-size: 1.05rem; white-space: nowrap; }
  .cw-progresso { flex: 1; min-width: 0; }
  .cw-progresso span { display: block; font-size: 0.78rem; font-weight: 700; color: var(--tinta-suave); margin-bottom: 0.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cw-barra { height: 6px; border-radius: 999px; background: var(--borda); overflow: hidden; }
  .cw-barra i { display: block; height: 100%; background: var(--cor-marca); border-radius: 999px; transition: width 0.3s ease; }

  .cw { max-width: 560px; margin: 0 auto; padding: 1.4rem 1.25rem 7.5rem; }
  .cw-card { background: var(--branco); border: 1px solid var(--borda); border-radius: var(--raio); padding: 1.4rem 1.25rem; animation: vbEntra 0.3s var(--ease-out) both; }
  .cw h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 0.35rem; }
  .cw-intro { color: var(--tinta-suave); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.2rem; }
  .cw-rotulo { font-size: 0.85rem; font-weight: 600; color: var(--tinta-suave); margin: 1.1rem 0 0.5rem; }

  /* cartões de opção (iguais aos do Agenda) */
  .segs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin-bottom: 0.6rem; }
  .seg-op { border: 2px solid var(--borda); border-radius: 12px; padding: 0.8rem 0.9rem; background: #fff; text-align: left; font-weight: 700; font-size: 0.92rem; color: var(--tinta); }
  .seg-op.ativo { border-color: var(--cor-marca); box-shadow: 0 0 0 2px rgba(178, 58, 40, 0.16); }

  .url-previa { padding: 0.8rem 1rem; border-radius: 10px; background: var(--linho); font-size: 0.9rem; word-break: break-all; margin-bottom: 0.6rem; color: var(--tinta-suave); }
  .url-previa b { color: var(--tinta); }

  .cw-rodape { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 0.8rem 1.25rem calc(0.8rem + env(safe-area-inset-bottom)); background: var(--branco); border-top: 1px solid var(--borda); display: flex; gap: 0.6rem; justify-content: center; }
  .cw-rodape > * { max-width: 540px; }
</style>
</head>
<body>
<header class="cw-topo">
  <a class="brand" href="/">← VB <em>Delivery</em></a>
  <div class="cw-progresso">
    <span id="passoRotulo">Passo 1 de 4</span>
    <div class="cw-barra"><i id="passoBarra" style="width:25%"></i></div>
  </div>
</header>
<main class="cw">
  <div id="passo"></div>
</main>
<div class="cw-rodape" id="rodape"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-client.js?v=1"></script>
<script src="/assets/js/util.js?v=4"></script>
<script src="/assets/js/templates.js?v=4"></script>
<script src="/assets/js/demo.js?v=4"></script>
<script src="/assets/js/criar.js?v=4"></script>
</body>
</html>

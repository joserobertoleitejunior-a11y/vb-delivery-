<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VB Delivery</title>
<meta name="description" content="Cardápio digital e pedido direto pelo WhatsApp — parte da plataforma VB.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Bangers&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css?v=1">
</head>
<body>

<header id="topbar">
  <button type="button" id="tbMenuBtn" aria-label="Abrir menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="tb-brand" id="tbBrand">VB Delivery</div>
  <span class="tb-status" id="tbStatus">Aberto</span>
</header>

<div id="drawer">
  <div class="backdrop" id="drawerBackdrop"></div>
  <nav class="painel">
    <strong style="font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:.4rem .6rem;">Cardápio</strong>
    <div id="drawerLinks"></div>
  </nav>
</div>

<main id="estadoCarregando" class="container" style="padding-top:3rem;text-align:center;color:var(--ink-soft);">
  Carregando…
</main>

<main id="estadoNaoEncontrado" class="container oculto" style="padding-top:3rem;text-align:center;">
  <p class="hero-eyebrow">Ops</p>
  <h1 class="hero-titulo" style="font-size:1.8rem;">Não encontramos esse cardápio</h1>
  <p class="hero-sub">Confira o link com quem te enviou.</p>
</main>

<div id="estadoPronto" class="oculto">
  <header class="hero" id="heroSecao">
    <p class="hero-eyebrow" id="heroEyebrow">Peça agora</p>
    <h1 class="hero-titulo" id="heroTitulo"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="hero-info" id="heroInfo"></div>
  </header>

  <div class="promo-banner oculto" id="promoBanner"></div>

  <nav class="nav-pills oculto" id="navPills"></nav>

  <div class="busca-wrap">
    <input type="search" class="busca-box" id="buscaBox" placeholder="Buscar no cardápio…">
  </div>

  <div id="cardapioConteudo"></div>
</div>

<div id="cartBar" class="vazio">
  <div class="cart-resumo" id="cartResumo">
    <span id="cartQtd">0 itens</span>
    <span id="cartTotal">R$ 0,00</span>
  </div>
  <div id="cartDetalhe"></div>
  <button type="button" class="cart-checkout" id="cartCheckoutBtn">Finalizar pedido</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-client.js?v=1"></script>
<script src="/assets/js/perfil.js?v=1"></script>
</body>
</html>
